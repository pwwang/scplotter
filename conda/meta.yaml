package:
  name: r-scplotter
  version: 0.10.0

source:
  path: ..

build:
  number: 1
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  host:
    # Imports:
    - r-base
    - r-callr
    - r-seuratobject
    - pwwang::bioconductor-screpertoire=2.9
    - pwwang::r-plotthis
    - r-gridgraphics
    - r-metap >=1.12
    - r-seurat
    - pwwang::r-tidyprompt

  run:
    - r-base
    - r-callr
    - r-seuratobject
    - pwwang::bioconductor-screpertoire=2.9
    - pwwang::r-plotthis
    - r-gridgraphics
    - r-metap >=1.12
    - r-seurat
    - pwwang::r-tidyprompt

test:
  commands:
    - $R -e "library('scplotter')"

about:
  home: https://github.com/pwwang/scplotter
  license: GPL-3
  summary: provides a set of functions to visualize single-cell sequencing data in an easy and efficient way.
  license_family: GPL
  license_file: LICENSE.md
